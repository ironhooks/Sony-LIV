name: Google Drive Flutter APK Builder

on:
  workflow_dispatch:
    inputs:
      google_drive_url:
        description: "Google Drive ZIP file URL containing the Flutter project"
        required: true
        type: string
      release_tag:
        description: "GitHub Release Tag"
        required: true
        default: "latest-build"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Download and Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Flutter 3.35.7 supports the Dart SDK constraint in this project.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Download Tools
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      - name: Download Flutter Source ZIP
        env:
          DRIVE_URL: ${{ inputs.google_drive_url }}
        run: |
          set -euo pipefail
          if [ -z "$DRIVE_URL" ]; then
            echo "ERROR: Google Drive URL is missing."
            exit 1
          fi
          gdown "$DRIVE_URL" -O source.zip
          test -s source.zip
          unzip -tq source.zip
          echo "Flutter source ZIP downloaded successfully."

      - name: Extract Source
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q source.zip -d source
          echo "ZIP contents:"
          find source -maxdepth 4 -type f | head -100

      - name: Locate Flutter Project
        run: |
          set -euo pipefail
          PUBSPEC=$(find source -type f -name pubspec.yaml \
            -not -path '*/.dart_tool/*' | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: Flutter pubspec.yaml not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          if [ ! -f "$PROJECT_DIR/lib/main.dart" ]; then
            echo "ERROR: Flutter project found, but lib/main.dart is missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project found: $PROJECT_DIR"

      - name: Generate Android Project
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            if [ ! -f setup.sh ]; then
              echo "ERROR: android/ and setup.sh are both missing."
              exit 1
            fi
            chmod +x setup.sh
            ./setup.sh
          else
            flutter pub get
          fi

          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

      # screen_brightness_android 2.1.6 uses the Kotlin compilerOptions DSL.
      # Upgrade the generated Android Gradle plugin versions and compile SDK.
      - name: Fix Android Gradle and Kotlin Compatibility
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          settings_candidates = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts"),
          ]
          settings = next((p for p in settings_candidates if p.exists()), None)
          if settings is None:
              raise SystemExit("ERROR: Android settings.gradle not found.")

          content = settings.read_text()
          content, agp_count = re.subn(
              r'(id\s*\(?["\']com\.android\.application["\']\)?\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>8.10.1\2', content
          )
          content, kotlin_count = re.subn(
              r'(id\s*\(?["\']org\.jetbrains\.kotlin\.android["\']\)?\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>2.1.0\2', content
          )
          if agp_count == 0 or kotlin_count == 0:
              raise SystemExit(
                  "ERROR: Could not update AGP/Kotlin plugin versions in " + str(settings)
              )
          settings.write_text(content)

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if not wrapper.exists():
              raise SystemExit("ERROR: Gradle wrapper properties not found.")
          wrapper_text = wrapper.read_text()
          wrapper_text, count = re.subn(
              r'gradle-[0-9.]+-(?:all|bin)\.zip',
              'gradle-8.11.1-all.zip',
              wrapper_text
          )
          if count == 0:
              raise SystemExit("ERROR: Could not update Gradle wrapper URL.")
          wrapper.write_text(wrapper_text)

          app_gradle = Path("android/app/build.gradle")
          app_gradle_kts = Path("android/app/build.gradle.kts")
          app_file = app_gradle if app_gradle.exists() else app_gradle_kts
          if not app_file.exists():
              raise SystemExit("ERROR: Android app Gradle file not found.")
          app_text = app_file.read_text()
          app_text, count = re.subn(
              r'compileSdk(?:Version)?\s*(?:=\s*)?flutter\.compileSdkVersion',
              'compileSdk 36' if app_file.suffix == ".gradle" else 'compileSdk = 36',
              app_text
          )
          if count == 0:
              raise SystemExit("ERROR: Could not set compileSdk to 36.")
          app_file.write_text(app_text)

          print("Updated AGP 8.10.1, Kotlin 2.1.0, Gradle 8.11.1 and compileSdk 36.")
          PY


      - name: Add R8 Missing Annotation Dependencies
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f android/app/build.gradle.kts ]; then
            APP_GRADLE="android/app/build.gradle.kts"
            if ! grep -q "com.google.errorprone:error_prone_annotations" "$APP_GRADLE"; then
              cat >> "$APP_GRADLE" <<'EOF'

          // Supplies annotation classes referenced by Google Tink during R8 shrinking.
          dependencies {
              implementation("com.google.errorprone:error_prone_annotations:2.36.0")
              implementation("com.google.code.findbugs:jsr305:3.0.2")
          }
          EOF
            fi
          elif [ -f android/app/build.gradle ]; then
            APP_GRADLE="android/app/build.gradle"
            if ! grep -q "com.google.errorprone:error_prone_annotations" "$APP_GRADLE"; then
              cat >> "$APP_GRADLE" <<'EOF'

          // Supplies annotation classes referenced by Google Tink during R8 shrinking.
          dependencies {
              implementation 'com.google.errorprone:error_prone_annotations:2.36.0'
              implementation 'com.google.code.findbugs:jsr305:3.0.2'
          }
          EOF
            fi
          else
            echo "ERROR: Android app Gradle file not found."
            exit 1
          fi

          echo "R8 annotation dependencies configured in $APP_GRADLE"

      - name: Verify Flutter and Resolve Dependencies
        run: |
          flutter --version
          flutter doctor -v
          flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm,android-arm64
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p output
          find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
            -maxdepth 1 -type f -name "*.apk" \
            -exec cp {} output/ \;

          if ! find output -maxdepth 1 -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No Flutter APK was generated."
            exit 1
          fi
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZooPLAY-Flutter-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Flutter APK Build ${{ inputs.release_tag }}
          body: |
            Automated Flutter Android APK build.

            Source: Google Drive ZIP
            Build type: Release APK
            Target platforms: Android ARMv7 and ARM64
            Android compile SDK: 36
            R8 annotation dependencies: error_prone_annotations + jsr305
            Build system: GitHub Actions
          files: output/*.apk
          fail_on_unmatched_files: true
          make_latest: true
