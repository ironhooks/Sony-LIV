name: Google Drive Flutter APK Builder

on:
  workflow_dispatch:
    inputs:
      google_drive_url:
        description: "Google Drive ZIP file URL containing the Flutter project"
        required: true
        type: string
      release_tag:
        description: "GitHub Release Tag"
        required: true
        default: "latest-build"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Download and Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Install Download Tools
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      - name: Download Flutter Source ZIP
        env:
          DRIVE_URL: ${{ inputs.google_drive_url }}
        run: |
          set -euo pipefail

          if [ -z "$DRIVE_URL" ]; then
            echo "ERROR: Google Drive URL is missing."
            exit 1
          fi

          gdown "$DRIVE_URL" -O source.zip

          if [ ! -s source.zip ]; then
            echo "ERROR: ZIP download failed."
            exit 1
          fi

          unzip -tq source.zip
          echo "Flutter source ZIP downloaded successfully."

      - name: Extract Source
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q source.zip -d source

          echo "ZIP contents:"
          find source -maxdepth 4 -type f | head -100

      - name: Locate Flutter Project
        run: |
          set -euo pipefail

          PUBSPEC=$(find source -type f -name pubspec.yaml \
            -not -path '*/.dart_tool/*' | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: Flutter pubspec.yaml not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          if [ ! -f "$PROJECT_DIR/lib/main.dart" ]; then
            echo "ERROR: Flutter project found, but lib/main.dart is missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project found: $PROJECT_DIR"

      - name: Prepare Android Project
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          # This source ZIP may not contain generated Android platform files.
          # Its setup.sh creates android/ and installs the TV manifest.
          if [ ! -d android ]; then
            if [ ! -f setup.sh ]; then
              echo "ERROR: android/ and setup.sh are both missing."
              exit 1
            fi
            chmod +x setup.sh
            ./setup.sh
          else
            flutter pub get
          fi

          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "ERROR: AndroidManifest.xml was not generated."
            exit 1
          fi

          echo "Android project is ready."

      - name: Verify Flutter Environment
        run: |
          flutter --version
          flutter doctor -v
          flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm,android-arm64
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p output

          find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
            -maxdepth 1 -type f -name "*.apk" \
            -exec cp {} output/ \;

          if ! find output -maxdepth 1 -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No Flutter APK was generated."
            exit 1
          fi

          echo "Generated APK:"
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZooPLAY-Flutter-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Flutter APK Build ${{ inputs.release_tag }}
          body: |
            Automated Flutter Android APK build.

            Source: Google Drive ZIP
            Build type: Release APK
            Target platforms: Android ARMv7 and ARM64
            Build system: GitHub Actions
          files: output/*.apk
          fail_on_unmatched_files: true
          make_latest: true
