
name: Google Drive APK Builder

on:
  workflow_dispatch:
    inputs:
      google_drive_url:
        description: "Google Drive ZIP file URL"
        required: true
        type: string

      release_tag:
        description: "GitHub Release Tag"
        required: true
        default: "latest-build"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Download and Build APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Setup Android SDK
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK: $ANDROID_HOME"

      # 4. Install SDK Packages
      - name: Install Android SDK Packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found!"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          yes | "$SDKMANAGER" --licenses

      # 5. Install Download Tools
      - name: Install Download Tools
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      # 6. Download Google Drive ZIP
      - name: Download Source ZIP
        env:
          DRIVE_URL: ${{ inputs.google_drive_url }}
        run: |
          if [ -z "$DRIVE_URL" ]; then
            echo "Google Drive URL is missing!"
            exit 1
          fi

          gdown "$DRIVE_URL" -O source.zip

          if [ ! -s source.zip ]; then
            echo "ZIP download failed!"
            exit 1
          fi

          if ! unzip -tq source.zip; then
            echo "Invalid ZIP file!"
            exit 1
          fi

          echo "Download successful!"

      # 7. Extract ZIP
      - name: Extract Source Code
        run: |
          mkdir -p source

          unzip -q source.zip -d source

          echo "ZIP extracted!"

          echo "ZIP contents:"
          find source -maxdepth 3 -type f | head -100

      # 8. Smart Android Project Detection
      - name: Locate Android Project
        run: |
          echo "Searching Android project..."

          PROJECT_DIR=""

          # Find Gradle Wrapper
          GRADLE_FILE=$(find source \
            -type f \
            -name gradlew \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -n "$GRADLE_FILE" ]; then

            PROJECT_DIR=$(dirname "$GRADLE_FILE")

            chmod +x "$GRADLE_FILE"

            echo "Gradle Wrapper found!"

          else

            echo "Gradle Wrapper not found."

            # Find settings.gradle
            SETTINGS_FILE=$(find source \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path "*/.gradle/*" \
              | head -n 1)

            if [ -n "$SETTINGS_FILE" ]; then

              PROJECT_DIR=$(dirname "$SETTINGS_FILE")

            else

              # Find build.gradle
              BUILD_FILE=$(find source \
                -type f \
                \( -name build.gradle -o -name build.gradle.kts \) \
                -not -path "*/.gradle/*" \
                | head -n 1)

              if [ -n "$BUILD_FILE" ]; then
                PROJECT_DIR=$(dirname "$BUILD_FILE")
              fi

            fi

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      # 9. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 10. Build Debug APK
      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace

          else

            gradle assembleDebug \
              --no-daemon \
              --stacktrace

          fi

      # 11. Collect APK
      - name: Collect APK Files
        run: |
          mkdir -p output

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" \
            -exec cp --parents {} output/ \;

          if ! find output -name "*.apk" | grep -q .; then
            echo "ERROR: No APK generated!"
            exit 1
          fi

          echo "Generated APK files:"
          find output -name "*.apk"

      # 12. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: output/**/*.apk
          if-no-files-found: error
          retention-days: 30

      # 13. Prepare Release
      - name: Prepare Release
        run: |
          mkdir -p release

          find output \
            -type f \
            -name "*.apk" \
            | while read -r apk; do

              cp "$apk" "release/$(basename "$apk")"

            done

          echo "Release files:"
          ls -lh release/

      # 14. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: APK Build ${{ inputs.release_tag }}
          body: |
            Automated Android APK Build

            Source: Google Drive ZIP
            Build Type: Debug APK
            Build System: GitHub Actions

            Download the APK from Assets below.
          files: release/*.apk
          fail_on_unmatched_files: true
          make_latest: true

