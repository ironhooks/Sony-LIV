Name: Google Drive APK Builder

on:
  workflow_dispatch:
    inputs:
      google_drive_url:
        description: "Google Drive ZIP file URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Download and Build APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Java
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Step 3: Setup Android SDK (Explicitly defining packages avoids the deprecated 'tools' lookup error)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # Step 4: Install Python and gdown
      - name: Install Download Tools
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      # Step 5: Download ZIP from Google Drive
      - name: Download Source ZIP
        env:
          DRIVE_URL: ${{ inputs.google_drive_url }}
        run: |
          if [ -z "$DRIVE_URL" ]; then
            echo "Google Drive URL is missing!"
            exit 1
          fi

          gdown "$DRIVE_URL" -O source.zip

          if [ ! -s source.zip ]; then
            echo "ZIP download failed!"
            exit 1
          fi

          echo "Download completed!"

      # Step 6: Extract ZIP
      - name: Extract Source Code
        run: |
          mkdir -p source
          unzip -q source.zip -d source

          echo "ZIP extracted successfully!"

      # Step 7: Find Android Project
      - name: Locate Android Project
        run: |
          GRADLE_FILE=$(find source -type f -name gradlew | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew not found!"
            echo "This ZIP may not contain a Gradle Android project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLE_FILE"

          echo "Android project found: $PROJECT_DIR"

      # Step 8: Build Debug APK
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # Step 9: Collect APK
      - name: Collect APK Files
        run: |
          mkdir -p output

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" \
            -exec cp {} output/ \;

          if [ -z "$(ls -A output)" ]; then
            echo "APK build failed or APK not found!"
            exit 1
          fi

          echo "APK files collected:"
          ls -lh output/

      # Step 10: Upload APK Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
