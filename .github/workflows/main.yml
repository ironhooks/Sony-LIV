
name: Google Drive APK Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Download Tool
        run: pip install gdown

      - name: Download Source ZIP
        env:
          FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
        run: |
          gdown --id "$FILE_ID" -O source.zip

      - name: Extract Source
        run: |
          mkdir -p source
          unzip -q source.zip -d source

      - name: Find Android Project
        run: |
          GRADLE_FILE=$(find source -name gradlew -type f | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle project not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          chmod +x "$GRADLE_FILE"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p output
          find "$PROJECT_DIR" \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" \
            -exec cp {} output/ \;

          if [ -z "$(ls -A output)" ]; then
            echo "APK not generated!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: output/*.apk
          retention-days: 30
